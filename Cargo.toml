[package]
name = "canpi-config"
version = "0.1.8"
authors = ["Mark Thornber <mark.thornber@merg.org.uk>"]
edition = "2021"

[lib]
name = "canpi_config"
path = "src/lib.rs"
test = true
crate-type = ["lib"]
required-features = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
include_dir = "0.7.2"
output = "*"
# Data serialisation library
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
serde_test = "1.0.130"
# JSON libraries
jsonschema = "0.31.0"
schemars = "1.0.4"
# Environment variable access libraries
dotenv = "0.15.0"
# .ini file library
#configparser = "3.0.0"
rust-ini = "0.21.1"
# Error handling
thiserror = "2.0.12"
anyhow = "1.0.98"
log = "0.4.27"
# Create file backup
backitup = "0.1.2"
glob = "0.3.2"
env_logger = "0.11.8"
slugrs = "0.5.0"
